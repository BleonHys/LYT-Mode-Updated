name: Publish theme release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify exact version tag
        run: node -e "const m=require('./manifest.json');if(process.env.GITHUB_REF_NAME!==m.version)throw Error('Tag must match manifest version without a v prefix')"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:docs
      - run: npm run package
      - run: git diff --exit-code -- theme.css manifest.json versions.json
      - name: Verify functional tests before publishing
        run: npm run test:container
      - name: Publish release with Obsidian assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "Focus-LYT $RELEASE_TAG" \
            --notes-file docs/RELEASE-NOTES.md \
            manifest.json theme.css "dist/focus-lyt-$RELEASE_TAG.zip"
